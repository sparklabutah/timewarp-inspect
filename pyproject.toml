[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "timewarp-inspect"
version = "0.1.0"
description = "Inspect AI implementation of TimeWarp, a benchmark of web agents across six eras of web UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md Farhan Ishmam" }, { name = "Kenneth Marino" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "inspect_ai>=0.3.276",
    "mcp>=1.23.0",
    "huggingface_hub>=0.34.0",
    # The default grader for the LLM-judged goals is an OpenAI model.
    "openai>=3.1.0",
]

[project.urls]
"Source Code" = "https://github.com/sparklabutah/timewarp-inspect"
"Issue Tracker" = "https://github.com/sparklabutah/timewarp-inspect/issues"
"Project Page" = "https://timewarp-web.github.io"
"Paper" = "https://arxiv.org/abs/2603.04949"
"Upstream Benchmark" = "https://github.com/sparklabutah/timewarp"

[project.entry-points.inspect_ai]
timewarp = "timewarp"

[dependency-groups]
dev = [
    "inspect-evals-lint==0.10.0",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/timewarp"]

[tool.inspect-evals-lint]
preset = "single-eval"

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "D", "I", "UP", "PLE", "PLW", "TID252"]
ignore = [
    "E501",  # line length is left to the formatter
    "D10",   # missing docstrings
    "D212",  # multi-line summary on the first line
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
packages = ["timewarp", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "dataset_download: downloads the TimeWarp task file from Hugging Face",
    "docker: builds and runs the TimeWarp Docker sandbox",
    "slow: takes more than a few seconds",
]
